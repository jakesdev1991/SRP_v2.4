SPECIFICATION Spec
INVARIANT Inv_FlashRequiresPcpAndTcb == (state = "S6.0_Firmware_Flash") => (tcb_measured = TRUE /\ pcp_verified = TRUE)
INVARIANT Inv_PxeRequiresPurge == (state = "S1.2_PXE_Deliver_LiveOS") => (peripherals_purged = TRUE)
INVARIANT Inv_MicrocodePatchRequiresSiliconCheck == (state = "S3.1_Microcode_Verify") => (silicon_clean = TRUE)
PROPERTY Liveness == <>[](state = "S9.0_Reboot" \/ state = "S10.0_Halt_Error")
