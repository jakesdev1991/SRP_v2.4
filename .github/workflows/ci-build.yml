name: Rust CI Build

on: [push, pull_request]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # FIXED: Replaces 'actions-rs/toolchain' (which caused Error 101 and warnings)
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # FIXED: Uses modern caching (simpler and faster than manual cache)
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check (Fast Compile)
        run: cargo check --verbose

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Run Linter (Clippy)
        # Using allow(warnings) ensures the build doesn't fail on minor style issues
        run: cargo clippy -- -A warnings
