name: Formal Verification

on: [push, pull_request]

jobs:
  tla:
    name: TLA+ Model Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install TLA+
        run: |
          # Download the standalone TLA+ tools jar (v1.8.0)
          wget https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar -O tla2tools.jar
          
          # Move it to a standard binary path
          sudo mv tla2tools.jar /usr/local/bin/tla2tools.jar

      - name: Run TLC Model Checker
        # Runs the jar directly against your local spec files
        run: java -jar /usr/local/bin/tla2tools.jar spec/SRP_v2_4.tla -config spec/SRP_v2_4.cfg -workers auto

  coq:
    name: Coq Proof Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Coq
        # Uses the official Ubuntu package manager for stability
        run: |
          sudo apt-get update
          sudo apt-get install -y coq

      - name: Verify Coq Install
        run: coqc --version

      - name: Build Coq Proofs
        run: |
          cd proof
          coqc TCB.v
          coqc SRP_v2_4.v
